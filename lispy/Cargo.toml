[package]
name          = "lispy"
description   = "Ports of some Common Lisp functions/macros."
homepage      = "https://crates.io/crates/lispy"
documentation = "https://docs.rs/lispy/"
repository    = "https://github.com/antichrome1/lispy-rs"
version       = "0.1.2"
edition       = "2024"
keywords      = ["macro", "proc-macro", "lisp"]
categories    = ["rust-patterns", "development-tools"]
authors       = ["Aditya Singh <antichrome1@proton.me>"]
license       = "ISC"
readme        = "README.md"

[dependencies]
macrobat         = "0.9.3"
lispy-procmacros = "0.1.2"

[lib]
name = "lispy"
path = "lispy.rs"

[profile.release]
strip         = true
opt-level     = 3
lto           = true
codegen-units = 1
debug         = false
panic         = 'unwind'
