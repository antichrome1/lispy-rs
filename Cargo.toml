[workspace]
resolver = "3"
members  = ["lispy-procmacros", "lispy"]

[workspace.package]
repository    = "https://github.com/antichrome1/lispy-rs"
version       = "0.1.0"
edition       = "2024"
keywords      = ["macro", "proc-macro", "lisp"]
categories    = ["rust-patterns", "development-tools"]
authors       = ["Aditya Singh <antichrome1@proton.me>"]
license       = "ISC"
readme        = "README.md"

[workspace.dependencies]
proc-macro2      = "1"
quote            = "1"
syn              = { version = "3", features = ["full"] }
macrobat         = "0.9.3"

[profile.release]
strip         = true
opt-level     = 3
lto           = true
codegen-units = 1
debug         = false
panic         = 'unwind'
